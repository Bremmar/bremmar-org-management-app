name: Deploy Bremmar to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          # Production and preview deployments use the authenticated API;
          # the local seeded adapter is opt-in for developer workstations.
          VITE_LOCAL_POC_MODE: 'false'
        run: npm run build:web

      - name: Build the Functions API
        run: npm run build:api

      - name: Prepare the Static Web Apps API artifact
        run: |
          npm run prepare:swa --workspace @eos/api
          npm install --omit=dev --ignore-scripts --prefix apps/api/dist --no-package-lock
          test -f apps/api/dist/host.json
          test "$(node -p "require('./apps/api/dist/package.json').main")" = "index.js"
          grep -q "route: 'platform-admin/users'" apps/api/dist/functions/admin.js
          grep -q "import './functions/meetings.js'" apps/api/dist/index.js
          grep -q "import './functions/workItems.js'" apps/api/dist/index.js
          grep -q "teams/{teamId}/meetings/{meetingId}/start" apps/api/dist/functions/meetings.js
          grep -q "teams/{teamId}/meetings/{meetingId}/notes" apps/api/dist/functions/meetings.js
          grep -q "route: 'rock-tasks/{taskId}'" apps/api/dist/functions/workItems.js

      - name: Get ID token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Deploy to the Victorious Meadow Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          # This is the deployment token generated for the Victorious Meadow app.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MEADOW_02A0D9700 }}
          action: upload
          # Vite has already built the static files into this directory.
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
          # Deploy the complete Functions v4 output. The artifact has host.json
          # and package.json at its root, with main pointing to index.js.
          api_location: apps/api/dist
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Environment
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: close
